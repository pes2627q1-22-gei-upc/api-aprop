version: "2"
sql:
  - engine: "postgresql"
    schema:
      - "internal/repositories/postgres/sqlc_schema_compat.sql"
      - "migrations"
    queries: "internal/repositories/postgres/queries"
    gen:
      go:
        package: "sqlc"
        out: "internal/repositories/postgres/sqlc"
        sql_package: "pgx/v5"
        # Keep generated types compatible with existing repository callers
        rename:
          postalcode: "PostalCode"
        overrides:
          - column: "events.modality"
            go_type:
              import: "github.com/jackc/pgx/v5/pgtype"
              type: "Text"
          - column: "notifications.type"
            go_type:
              type: "int32"
          - db_type: "pg_catalog.bool"
            nullable: true
            go_type:
              import: "github.com/jackc/pgx/v5/pgtype"
              type: "Bool"
          - column: "EventRatings.reliability"
            go_type:
              import: "github.com/jackc/pgx/v5/pgtype"
              type: "Float4"
