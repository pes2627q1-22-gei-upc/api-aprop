name: CI/CD

on:
  push:
    branches:
      - develop
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- CI ----------
  test:
    name: Tests & Build
    runs-on: ubuntu-latest
    # Real Postgres so the migration integration tests run instead of being skipped
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Compile executable (cmd/app)
        run: go build -v ./cmd/app

      - name: Run unit and integration tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  # Reproduces the Render boot: Supabase applies supabase/migrations first, then the API
  # (golang-migrate) migrates on top of it. A failure here is a failed deploy.
  migrations-supabase:
    name: Migrations on local Supabase
    runs-on: ubuntu-latest
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '54322'
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: latest

      # Starting the stack applies supabase/migrations/ (fails on broken SQL).
      # Only the database is needed: skip the other services to start faster.
      - name: Start local Supabase
        run: supabase start -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Build API
        run: go build -o aprop-api ./cmd/app

      - name: API migrates on top of Supabase
        run: ./aprop-api migrate

      - name: Second boot changes nothing
        run: ./aprop-api migrate

      - name: golang-migrate state is clean
        run: |
          dirty=$(psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc "SELECT dirty FROM public.schema_migrations")
          echo "dirty=$dirty"
          [ "$dirty" = "f" ]

      - name: A dirty state left by a crash heals on next boot
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -c "UPDATE public.schema_migrations SET dirty = true"
          ./aprop-api migrate
          [ "$(psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -Atc 'SELECT dirty FROM public.schema_migrations')" = "f" ]

  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

  vulncheck:
    name: Vulnerabilities (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...

  # ---------- CD ----------
  # Only runs for version tags (e.g. v1.0.0), after every CI job has passed.
  publish:
    name: Publish Docker image (GHCR)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, lint, vulncheck, migrations-supabase]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image tags: the git tag (e.g. v1.0.0) and latest
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # TODO(DP-024): deploy the published image to EC2 once the server and its secrets are set up

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
